train:
    num_epochs: 50  # try more epochs once?
    batch_size: 2  # 36
    learning_rate: 0.0005
    weight_decay: 0.0001
    criterion: "focal_loss"  # "cross_entropy", "focal_loss", "vae_loss", "ae_loss"
    vae_criterion_beta: 0.01
    vae_criterion_use_smooth_beta: False
    vae_criterion_use_smooth_beta_start_value: 0.0
    optimizer: "Adamw"  # "Adamw", "SGD"
    warmup_epochs: 0
    scheduler: "cosine"  # "cosine", "step"
    output_dir: "./output"
    exp_name: "NCA_experiment_global_attn_img" #  "experiment_run_fixed"
    used_train_samples: -1  # -1, 5
    used_val_samples: -1   # -1, 5
    continue_training: False
    last_training_output_dir: "./output/2026-08-11_22-49-08_NCA_experiment_time_FiLM"
